name: niyam

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: niyam
      POSTGRES_PASSWORD: niyam
      POSTGRES_DB: niyam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyam -d niyam"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      NIYAM_DATABASE_URL: postgresql://niyam:niyam@db:5432/niyam
      NIYAM_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - niyam-data:/app/data/cache
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  niyam-data:
