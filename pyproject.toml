[project]
name = "niyam"
version = "0.1.0"
description = "Citation-checked question answering over RBI regulations with hybrid retrieval and a reproducible evaluation harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Niyam contributors" }]
keywords = ["rag", "retrieval", "pgvector", "llm", "evaluation", "rbi", "regulatory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pymupdf>=1.24",
  "tiktoken>=0.7",
  "fastembed>=0.4",
  "anthropic>=2.0",
  "tenacity>=8.5",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
openai = ["openai>=1.99"]
gemini = ["google-genai>=1.20"]
tracing = ["langfuse>=3.0"]
all = ["niyam[openai,gemini,tracing]"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "pgserver>=0.1.4",
]

[project.scripts]
niyam = "niyam.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niyam"]

[tool.hatch.build.targets.wheel.force-include]
"src/niyam/db/schema.sql" = "niyam/db/schema.sql"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
packages = ["niyam"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "db: requires a running Postgres with pgvector (NIYAM_TEST_DATABASE_URL or embedded pgserver)",
  "model: downloads and runs a local ONNX model",
  "network: reaches the public internet",
]
addopts = "-ra"
